<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project.name }}</title>
    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121316;           /* Background */
            --card-bg: #1e2025;            /* Container / Card background */
            --input-bg: #16181d;           /* Image background fallback */
            --text-main: #e2e8f0;          /* Main light text */
            --text-muted: #94a3b8;         /* Muted slate text */
            --border-color: #2e3440;       /* Dark border color */
            --accent-blue: #5c8ca8;        /* Toned-down cyan/blue */
            --accent-hover: #4b7893;       /* Hover state cyan/blue */
            --badge-bg: rgba(92, 140, 168, 0.15);
            --badge-text: #5c8ca8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2.5rem 1.5rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .project-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .project-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .tech-badge {
            align-self: flex-start;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.35rem 0.75rem;
            border-radius: 8px;
        }

        .project-description {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            word-break: break-word;
        }

        .project-image {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .github-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 500;
            word-break: break-all;
            transition: color 0.2s ease;
        }

        .github-link:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            body {
                padding: 1.5rem 1rem;
            }

            .card {
                padding: 1.5rem;
            }

            .card-header {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        <article class="card">
            <div class="card-header">
                <h1 class="project-title">{{ project.name }}</h1>
                <span class="project-date">{{ project.date }}</span>
            </div>

            <strong class="tech-badge">{{ project.technologies }}</strong>

            <p class="project-description">{{ project.description }}</p>

            <img src="{{ project.image.url }}" alt="{{ project.name }}" class="project-image">

            <div class="card-footer">
                <a href="/portfolio/projects/" class="github-link"  rel="noopener noreferrer">
                    &larr; go back 
                </a>
                <a href="{{ project.github_link }}" class="github-link" target="_blank" rel="noopener noreferrer">
                    {{ project.github_link }} &rarr;
                </a>
            </div>
        </article>
    </main>

</body>
</html>
