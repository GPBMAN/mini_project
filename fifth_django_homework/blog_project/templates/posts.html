<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts</title>
</head>
<body>
    {% for post in posts %}
        <div>
            <h2>{{ post.title }}</h2>
            <p>By {{ post.author }} on {{ post.created_at }}</p>
            <p>{{ post.text }}</p>
        </div>
        <a href="{% url 'post_detail' post.id %}"><button>detailed view</button></a>
        <hr>
    {% endfor %}
</body>
</html>
